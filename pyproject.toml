[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runpod-ops"
version = "0.1.0"
description = "Self-hosted RunPod pod lifecycle, failover, and cost controls"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
runpod-ops = "runpod_ops.cli:main"

[tool.setuptools.packages.find]
include = ["runpod_ops*"]

[tool.setuptools.package-data]
"runpod_ops.web" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
